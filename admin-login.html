
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#123d5a">
  <title>SiOMC Admin Portal</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Tahoma, sans-serif;
      background: #f3f7fa;
      color: #173b52;
    }

    .admin-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 36px;
      background: white;
      border: none;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(18,61,90,.10);
    }

    .brand {
      text-align: center;
      margin-bottom: 28px;
      border: none !important;
    }

    .brand h1 {
      margin: 0 0 8px;
      color: #123d5a;
      font-size: 28px;
      border: none !important;
    }

    .brand p {
      margin: 0 0 5px;
      color: #688092;
      font-size: 14px;
      border: none !important;
    }

    .login-card label {
      display: block;
      margin: 18px 0 8px;
      font-size: 14px;
      font-weight: bold;
    }

    .login-card input,
    .login-card select {
      display: block;
      width: 100%;
      padding: 13px;
      border: 1px solid #d6e1e8;
      border-radius: 9px;
      font-size: 15px;
      background: white;
      color: #173b52;
    }

    .login-button {
      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;
      position: relative;
      z-index: 10;
      width: 100%;
      min-height: 48px;
      margin-top: 24px;
      padding: 14px;
      border: none !important;
      border-radius: 9px;
      background: #123d5a !important;
      color: white !important;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-button:hover {
      background: #1d6488 !important;
    }

    .login-button:disabled {
      opacity: .65 !important;
      cursor: not-allowed;
    }

    .forgot-wrapper {
      text-align: center;
      margin-top: 18px;
      border: none !important;
    }

    #forgotPassword {
      color: #123d5a;
      font-size: 14px;
      text-decoration: underline;
      border: none !important;
    }

    #resetMessage {
      text-align: center;
      font-size: 13px;
      line-height: 1.6;
      border: none !important;
    }

    .notice {
      margin-top: 20px;
      text-align: center;
      color: #8193a0;
      font-size: 12px;
      line-height: 1.8;
      border: none !important;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 26px 22px;
      }
    }
  </style>
</head>

<body>

  <main class="admin-container">
    <section class="login-card">

      <div class="brand">
        <h1>SiOMC</h1>
        <p>Admin Portal</p>
        <p>Clinical Care Management System</p>
      </div>

      <form id="adminLoginForm">

        <label for="staffRole">ประเภทผู้ใช้งาน</label>
        <select id="staffRole" required>
          <option value="">เลือกประเภทผู้ใช้งาน</option>
          <option value="admin">ผู้ดูแลระบบ</option>
          <option value="system_admin">System Admin</option>
          <option value="doctor">แพทย์</option>
          <option value="nurse">พยาบาล</option>
          <option value="dietitian">นักกำหนดอาหาร</option>
        </select>

        <label for="staffEmail">อีเมลเจ้าหน้าที่</label>
        <input
          type="email"
          id="staffEmail"
          placeholder="กรอกอีเมล"
          required
        >

        <label for="staffPassword">รหัสผ่าน</label>
        <input
          type="password"
          id="staffPassword"
          placeholder="กรอกรหัสผ่าน"
          required
        >

        <button class="login-button" type="submit">
          เข้าสู่ระบบ
        </button>

      </form>

      <div class="forgot-wrapper">
        <a href="#" id="forgotPassword">ลืมรหัสผ่าน?</a>
      </div>

      <p id="resetMessage"></p>

      <p class="notice">
        สำหรับบุคลากรที่ได้รับอนุญาตเท่านั้น<br>
        Siriraj Obesity and Metabolic Center
      </p>

    </section>
  </main>

  <script type="module">
    import { supabase } from './supabase.js';

    const form = document.getElementById('adminLoginForm');
    const loginButton = form.querySelector('button[type="submit"]');
    const forgotPassword = document.getElementById('forgotPassword');
    const resetMessage = document.getElementById('resetMessage');

    // เข้าสู่ระบบ
    form.addEventListener('submit', async function(event) {
      event.preventDefault();

      const role = document.getElementById('staffRole').value;
      const email = document.getElementById('staffEmail').value.trim();
      const password = document.getElementById('staffPassword').value;

      loginButton.disabled = true;
      loginButton.textContent = 'กำลังตรวจสอบ...';

      try {
        const { data, error } = await supabase.auth.signInWithPassword({
          email,
          password
        });

        if (error) {
          throw new Error('อีเมลหรือรหัสผ่านไม่ถูกต้อง');
        }

        const { data: profile, error: profileError } = await supabase
          .from('profiles')
          .select('role, is_active, full_name')
          .eq('id', data.user.id)
          .maybeSingle();

        if (profileError || !profile) {
          await supabase.auth.signOut();
          throw new Error('ไม่พบข้อมูลเจ้าหน้าที่ กรุณาติดต่อผู้ดูแลระบบ');
        }

        if (profile.is_active !== true) {
          await supabase.auth.signOut();
          throw new Error('บัญชีนี้ถูกระงับการใช้งาน');
        }

        if (profile.role !== role) {
          await supabase.auth.signOut();
          throw new Error('ประเภทผู้ใช้งานไม่ตรงกับสิทธิ์ของบัญชี');
        }

        window.location.href = './admin.html';

      } catch (error) {
        alert(error.message || 'เกิดข้อผิดพลาด กรุณาลองใหม่');

        loginButton.disabled = false;
        loginButton.textContent = 'เข้าสู่ระบบ';
      }
    });

    // ลืมรหัสผ่าน
    forgotPassword.addEventListener('click', async function(event) {
      event.preventDefault();

      const email = document.getElementById('staffEmail').value.trim();

      if (!email) {
        resetMessage.textContent = 'กรุณากรอกอีเมลก่อนกดลืมรหัสผ่าน';
        return;
      }

      forgotPassword.style.pointerEvents = 'none';
      resetMessage.textContent = 'กำลังส่งอีเมล...';

      try {
        const { error } = await supabase.auth.resetPasswordForEmail(email, {
          redirectTo: window.location.origin +
            window.location.pathname.replace(
              'admin-login.html',
              'set-password.html'
            )
        });

        if (error) throw error;

        resetMessage.textContent =
          'ส่งคำขอเรียบร้อยแล้ว หากอีเมลนี้ลงทะเบียนไว้ในระบบ กรุณาตรวจสอบกล่องอีเมล';

      } catch (error) {
        resetMessage.textContent =
          'ไม่สามารถส่งอีเมลได้ กรุณาลองใหม่อีกครั้ง';

        console.error('Password reset error:', error);

      } finally {
        forgotPassword.style.pointerEvents = 'auto';
      }
    });
  </script>

</body>
</html>
