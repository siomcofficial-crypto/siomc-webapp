
<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#123d5a">
  <title>SiOMC | ตั้งรหัสผ่าน</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f2f6f9;
      color: #19364b;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 32px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }

    h2 { margin-top: 0; text-align: center; }
    p { color: #647789; text-align: center; line-height: 1.6; }

    label {
      display: block;
      margin: 18px 0 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccd6df;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #123d5a;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled { opacity: .6; cursor: not-allowed; }

    #message {
      margin-top: 18px;
      text-align: center;
      line-height: 1.6;
      white-space: pre-line;
    }
  </style>
</head>

<body>
  <main class="container">
    <h2>ตั้งรหัสผ่าน SiOMC</h2>
    <p>กำหนดรหัสผ่านสำหรับเข้าใช้งานระบบผู้ดูแล</p>

    <form id="passwordForm" hidden>
      <label for="password">รหัสผ่านใหม่</label>
      <input
        id="password"
        type="password"
        minlength="8"
        autocomplete="new-password"
        required
        placeholder="อย่างน้อย 8 ตัวอักษร"
      >

      <label for="confirmPassword">ยืนยันรหัสผ่าน</label>
      <input
        id="confirmPassword"
        type="password"
        minlength="8"
        autocomplete="new-password"
        required
        placeholder="กรอกรหัสผ่านอีกครั้ง"
      >

      <button id="submitButton" type="submit">
        บันทึกรหัสผ่าน
      </button>
    </form>

    <div id="message">กำลังตรวจสอบสิทธิ์...</div>
  </main>

  <script type="module">
    import { supabase } from './supabase.js';

    const form = document.getElementById('passwordForm');
    const message = document.getElementById('message');
    const button = document.getElementById('submitButton');

    async function checkSession() {
      const { data, error } = await supabase.auth.getSession();

      if (error || !data.session) {
        message.textContent =
          'ไม่พบสิทธิ์สำหรับตั้งรหัสผ่าน กรุณาเปิดลิงก์เชิญใช้งานอีกครั้ง หรือติดต่อผู้ดูแลระบบเพื่อส่งคำเชิญใหม่';
        return;
      }

      message.textContent = '';
      form.hidden = false;
    }

    supabase.auth.onAuthStateChange((event, session) => {
      if (
        (event === 'SIGNED_IN' || event === 'PASSWORD_RECOVERY') &&
        session
      ) {
        message.textContent = '';
        form.hidden = false;
      }
    });

    await checkSession();

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      const password = document.getElementById('password').value;
      const confirmPassword =
        document.getElementById('confirmPassword').value;

      if (password.length < 8) {
        message.textContent = 'รหัสผ่านต้องมีอย่างน้อย 8 ตัวอักษร';
        return;
      }

      if (password !== confirmPassword) {
        message.textContent = 'รหัสผ่านทั้งสองช่องไม่ตรงกัน';
        return;
      }

      button.disabled = true;
      message.textContent = 'กำลังบันทึกรหัสผ่าน...';

      const { error } = await supabase.auth.updateUser({ password });

      if (error) {
        message.textContent = 'ไม่สามารถบันทึกรหัสผ่านได้: ' + error.message;
        button.disabled = false;
        return;
      }

      await supabase.auth.signOut();

      message.textContent =
        'ตั้งรหัสผ่านสำเร็จแล้ว กำลังไปยังหน้าเข้าสู่ระบบ...';

      setTimeout(() => {
        window.location.href = './admin-login.html';
      }, 1500);
    });
  </script>
</body>
</html>
