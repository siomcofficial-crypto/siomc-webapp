
<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#123d5a">
  <title>SiOMC | ตั้งรหัสผ่าน</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f2f6f9;
      color: #19364b;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 32px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }

    h2 { margin-top: 0; text-align: center; }
    p { color: #647789; text-align: center; line-height: 1.6; }

    label {
      display: block;
      margin: 18px 0 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccd6df;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #123d5a;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled { opacity: .6; cursor: not-allowed; }

    #message {
      margin-top: 18px;
      text-align: center;
      line-height: 1.6;
      white-space: pre-line;
    }
  </style>
  <link rel="stylesheet" href="./siomc-design.css">
</head>

<body>
  <main class="container">
    <h2>ตั้งรหัสผ่าน SiOMC</h2>
    <p>กำหนดรหัสผ่านสำหรับเข้าใช้งานระบบผู้ดูแล</p>

    <form id="passwordForm" hidden>
      <label for="password">รหัสผ่านใหม่</label>
      <input
        id="password"
        type="password"
        minlength="8"
        autocomplete="new-password"
        required
        placeholder="อย่างน้อย 8 ตัวอักษร"
      >

      <label for="confirmPassword">ยืนยันรหัสผ่าน</label>
      <input
        id="confirmPassword"
        type="password"
        minlength="8"
        autocomplete="new-password"
        required
        placeholder="กรอกรหัสผ่านอีกครั้ง"
      >

      <button id="submitButton" type="submit">
        บันทึกรหัสผ่าน
      </button>
    </form>

    <div id="message">กำลังตรวจสอบสิทธิ์...</div>
  </main>

  
<script type="module">
const initialUrl = new URL(window.location.href);
const query = initialUrl.searchParams;
const hash = new URLSearchParams(initialUrl.hash.slice(1));

const tokenHash = query.get('token_hash');
const tokenType = query.get('type');
const hasAuthLink = Boolean(
  tokenHash ||
  query.get('code') ||
  hash.get('access_token')
);
const linkError =
  query.get('error_description') ||
  hash.get('error_description');

const { supabase } = await import('./supabase.js');

const form = document.getElementById('passwordForm');
const message = document.getElementById('message');
const button = document.getElementById('submitButton');

let verifiedUserId = null;

async function initializePasswordPage() {
  form.hidden = true;

  try {
    if (linkError) {
      throw new Error('ลิงก์ไม่ถูกต้องหรือหมดอายุ');
    }

    if (!hasAuthLink) {
      throw new Error('ไม่พบข้อมูลยืนยันตัวตนจากลิงก์');
    }

    if (tokenHash) {
      if (!['invite', 'recovery'].includes(tokenType)) {
        throw new Error('ประเภทลิงก์ไม่ถูกต้อง');
      }

      const { error } = await supabase.auth.verifyOtp({
        token_hash: tokenHash,
        type: tokenType
      });

      if (error) throw error;
    }

    // Supabase SDK จัดการ code และ access token
    // จาก callback ให้อัตโนมัติ
    const { data, error } = await supabase.auth.getUser();

    if (error || !data.user) {
      throw new Error('ไม่สามารถยืนยันสิทธิ์ได้');
    }

    verifiedUserId = data.user.id;

    history.replaceState(null, '', location.pathname);

    message.textContent = '';
    form.hidden = false;

  } catch (error) {
    console.error(
      'Password link verification failed:',
      error.code || error.message
    );

    message.textContent =
      'ลิงก์ตั้งรหัสผ่านใช้ไม่ได้หรือหมดอายุ ' +
      'กรุณาขอลิงก์ใหม่จากหน้าเข้าสู่ระบบ';
  }
}

form.addEventListener('submit', async (event) => {
  event.preventDefault();

  if (!verifiedUserId) return;

  const password =
    document.getElementById('password').value;

  const confirm =
    document.getElementById('confirmPassword').value;

  if (password.length < 8) {
    message.textContent =
      'รหัสผ่านต้องมีอย่างน้อย 8 ตัวอักษร';
    return;
  }

  if (password !== confirm) {
    message.textContent =
      'รหัสผ่านทั้งสองช่องไม่ตรงกัน';
    return;
  }

  button.disabled = true;
  message.textContent = 'กำลังบันทึกรหัสผ่าน...';

  try {
    // ป้องกันการตั้งรหัสผ่านผิดบัญชี
    const { data, error: userError } =
      await supabase.auth.getUser();

    if (
      userError ||
      data.user?.id !== verifiedUserId
    ) {
      throw new Error('Session ไม่ตรงกับบัญชีที่ยืนยัน');
    }

    const { error } = await supabase.auth.updateUser({
      password
    });

    if (error) throw error;

    await supabase.auth.signOut({ scope: 'local' });

    message.textContent =
      'ตั้งรหัสผ่านสำเร็จ กำลังไปหน้าเข้าสู่ระบบ...';

    setTimeout(() => {
      window.location.replace('./admin-login.html');
    }, 1200);

  } catch (error) {
    console.error(
      'Password update failed:',
      error.code || error.message
    );

    message.textContent =
      'บันทึกรหัสผ่านไม่สำเร็จ กรุณาลองใหม่';

    button.disabled = false;
  }
});

await initializePasswordPage();
</script>

</body>
</html>
